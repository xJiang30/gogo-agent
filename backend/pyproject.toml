[project]
name = "gogo-agent-backend"
version = "0.1.0"
description = "FastAPI backend for Gogo Agent with OpenAI Agents SDK and LiteLLM."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "openai-agents>=0.2.0",
  "litellm>=1.74.0,<1.75.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
  "ruff>=0.12.0"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
